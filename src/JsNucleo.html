<script>
/* OxoPedia · Núcleo: estado, llamadas al servidor, utilidades, enrutador y estructura (cabecera + barra lateral) */
'use strict';

const S = { user: null, cfg: null, secciones: [], articulos: [], indice: null, cacheArt: {}, abiertas: new Set(), imgs: {} };
const $ = function (s, r) { return (r || document).querySelector(s); };
const $$ = function (s, r) { return Array.from((r || document).querySelectorAll(s)); };
const esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
const norm = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
const esAdmin = function () { return S.user && S.user.rol === 'Administrador'; };

/** Llamada al servidor (google.script.run) como promesa. */
let _cargas = 0;
function progreso(delta) { _cargas = Math.max(0, _cargas + delta); const b = $('#progreso'); if (b) b.classList.toggle('on', _cargas > 0); }
function api(accion, payload) {
  progreso(1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) { progreso(-1); if (r && r.ok) resolve(r.data); else reject(new Error((r && r.error) || 'Error desconocido')); })
      .withFailureHandler(function (e) { progreso(-1); reject(new Error((e && e.message) || 'No hay conexión con el servidor')); })
      .api(accion, payload || {});
  });
}

/* ── Fechas y textos ── */
function parseFecha(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(s || '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null;
}
function fechaCorta(s) {
  const d = parseFecha(s);
  return d ? d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '') : '—';
}
function fechaHora(s) {
  const d = parseFecha(s);
  return d ? d.toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace('.', '') : '—';
}
function diasDesde(s) { const d = parseFecha(s); return d ? Math.floor((Date.now() - d.getTime()) / 86400000) : null; }
function nombreDe(email) {
  if (!email) return 'Sin asignar';
  return String(email).split('@')[0].split(/[._-]+/).map(function (p) { return p ? p.charAt(0).toUpperCase() + p.slice(1) : ''; }).join(' ');
}
function claseEstado(e) { return String(e || 'Borrador').replace(/ó/g, 'o').replace(/\s+/g, '-'); }
function badgeEstado(e) { return '<span class="badge ' + claseEstado(e) + '">' + esc(e || 'Borrador') + '</span>'; }
function porRevisar(a) {
  if (a.estado !== 'Validado') return false;
  const d = diasDesde(a.fecha_revision || a.fecha_creacion);
  return d !== null && d > S.cfg.dias_para_revisar;
}

/* ── Catálogo ── */
function secPorId(id) { return S.secciones.find(function (s) { return s.id === id; }); }
function secPorSlug(sl) { return S.secciones.find(function (s) { return s.slug === sl; }); }
function artPorSlug(sl) { return S.articulos.find(function (a) { return a.slug === sl; }); }
function raices() { return S.secciones.filter(function (s) { return !s.padre_id; }); }
function hijosDe(id) { return S.secciones.filter(function (s) { return s.padre_id === id; }); }
function artsDe(secId) { return S.articulos.filter(function (a) { return a.seccion_id === secId; }).sort(function (a, b) { return a.orden - b.orden || a.titulo.localeCompare(b.titulo); }); }
function artsDeArbol(sec) {
  let l = artsDe(sec.id);
  hijosDe(sec.id).forEach(function (h) { l = l.concat(artsDe(h.id)); });
  return l;
}
function raizDe(sec) { return sec && sec.padre_id ? secPorId(sec.padre_id) : sec; }
function colorDe(secId) { const s = secPorId(secId); return s ? s.color : '#49677a'; }
function rutaSec(s) { return '#/s/' + encodeURIComponent(s.slug); }
function rutaArt(a) { return '#/a/' + encodeURIComponent(a.slug); }

async function refrescarCatalogo() {
  const d = await api('arranque');
  S.user = d.usuario; S.cfg = d.config; S.secciones = d.secciones; S.articulos = d.articulos;
  S.indice = null; S.cacheArt = {};
  pintarNav();
}

/* ── Avisos y ventanas ── */
function toast(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || '');
  el.innerHTML = '<i class="ph ph-' + (tipo === 'err' ? 'warning-circle' : tipo === 'ok' ? 'check-circle' : 'info') + '"></i><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(function () { el.classList.add('saliendo'); setTimeout(function () { el.remove(); }, 260); }, tipo === 'err' ? 7000 : 3500);
}

/** modal({titulo, cuerpo(HTML), botones:[{txt, clase, onClick(cerrar)}], ancho}) → { el, cerrar } */
function modal(o) {
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = '<div class="modal ' + (o.ancho ? 'ancho' : '') + '" role="dialog" aria-modal="true"><header><h2>' + esc(o.titulo) + '</h2><button class="btn-ico" data-x aria-label="Cerrar"><i class="ph ph-x"></i></button></header><div class="cuerpo">' + (o.cuerpo || '') + '</div>' + ((o.botones && o.botones.length) ? '<footer></footer>' : '') + '</div>';
  let cerrado = false;
  const cerrar = function () { if (cerrado) return; cerrado = true; document.removeEventListener('keydown', alEsc); velo.classList.add('saliendo'); setTimeout(function () { velo.remove(); }, 190); };
  const alEsc = function (e) { if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', alEsc);
  velo.addEventListener('mousedown', function (e) { if (e.target === velo) cerrar(); });
  $('[data-x]', velo).onclick = cerrar;
  (o.botones || []).forEach(function (b) {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.clase || 'btn-s'); btn.textContent = b.txt;
    btn.onclick = function () { b.onClick ? b.onClick(cerrar, btn) : cerrar(); };
    $('footer', velo).appendChild(btn);
  });
  $('#modales').appendChild(velo);
  const foco = $('input, select, textarea', velo); if (foco) foco.focus();
  return { el: velo, cerrar: cerrar };
}

function confirmar(titulo, mensaje, textoOk, peligro) {
  return new Promise(function (resolve) {
    let resuelto = false;
    const fin = function (v) { if (!resuelto) { resuelto = true; resolve(v); } };
    const m = modal({ titulo: titulo, cuerpo: '<p>' + esc(mensaje) + '</p>', botones: [
      { txt: 'Cancelar', onClick: function (c) { fin(false); c(); } },
      { txt: textoOk || 'Aceptar', clase: peligro ? 'btn-x' : 'btn-p', onClick: function (c) { fin(true); c(); } }] });
    m.el.addEventListener('mousedown', function (e) { if (e.target === m.el) fin(false); });
    $('[data-x]', m.el).addEventListener('click', function () { fin(false); });
  });
}

/** Ejecuta una acción mostrando «cargando» en el botón y avisando de errores. */
async function conBoton(btn, fn) {
  const html = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="ph ph-circle-notch girar"></i> Un momento…';
  try { return await fn(); }
  catch (e) { toast(e.message, 'err'); }
  finally { btn.disabled = false; btn.innerHTML = html; }
}

function copiarTexto(txt) {
  return new Promise(function (resolve) {
    const respaldo = function () {
      const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      t.remove(); resolve(ok);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { resolve(true); }, respaldo);
    else respaldo();
  });
}

function descargarBase64(nombre, mime, base64) {
  const bin = atob(base64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/octet-stream' }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 500);
}

/* ── Enrutador ── */
function rutaActual() {
  const h = location.hash.replace(/^#\/?/, '');
  const partes = h.split('?');
  return { p: partes[0].split('/').filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(partes[1] || '') };
}
let _hashPrevio = location.hash;
let _ignorarHash = false;
window.__sucio = false;

window.addEventListener('hashchange', function () {
  if (_ignorarHash) { _ignorarHash = false; return; }
  if (window.__sucio && !window.confirm('Tienes cambios sin guardar. ¿Salir de todos modos?')) {
    _ignorarHash = true; location.hash = _hashPrevio; return;
  }
  window.__sucio = false;
  _hashPrevio = location.hash;
  navegar();
});
window.addEventListener('beforeunload', function (e) { if (window.__sucio) { e.preventDefault(); e.returnValue = ''; } });

function ir(h) { location.hash = h; }

/* ── URL de la barra de direcciones (?view=<identificador>#<identificador>) ──
   El enrutador interno sigue usando #/… dentro del iframe; aquí se refleja en la URL real con google.script.history. */
const _enc = encodeURIComponent;
function urlDeRuta() {
  const r = rutaActual(), o = r.p[0] || '';
  if (o === 's' || o === 'a') return r.p[1] ? { params: { view: r.p[1] }, hash: r.p[1] } : { params: {}, hash: '' };
  if (o === 'buscar') return { params: r.q.get('q') ? { view: 'buscar', q: r.q.get('q') } : { view: 'buscar' }, hash: 'buscar' };
  if (o === 'nuevo') return { params: r.p[1] ? { view: 'nuevo', seccion: r.p[1] } : { view: 'nuevo' }, hash: 'nuevo' };
  if (o === 'editar') return { params: r.p[1] ? { view: 'editar', id: r.p[1] } : { view: 'editar' }, hash: 'editar' };
  if (o === 'admin') { const v = 'gestion-' + (r.p[1] || 'secciones'); return { params: { view: v }, hash: v }; }
  return { params: {}, hash: '' };
}
/** Parámetros de la URL (valores ya decodificados) → ruta interna. */
function rutaDeUrl(p) {
  p = p || {};
  const v = p.view || '';
  if (!v) return p.a ? '#/a/' + _enc(p.a) : (p.s ? '#/s/' + _enc(p.s) : '#/');
  if (v === 'buscar') return '#/buscar?q=' + _enc(p.q || '');
  if (v === 'nuevo') return '#/nuevo' + (p.seccion ? '/' + _enc(p.seccion) : '');
  if (v === 'editar') return '#/editar/' + _enc(p.id || '');
  if (v.indexOf('gestion-') === 0) return '#/admin/' + _enc(v.slice(8));
  if (secPorSlug(v)) return '#/s/' + _enc(v);
  return '#/a/' + _enc(v);
}
let _urlPrevia = null, _desdeHistorial = false;
function sincronizarUrl() {
  const gh = window.google && google.script && google.script.history;
  if (!gh) return;
  const u = urlDeRuta(), clave = JSON.stringify(u);
  if (_desdeHistorial) { _desdeHistorial = false; _urlPrevia = clave; return; } // viene de atrás/adelante: la URL ya es la correcta
  if (clave === _urlPrevia) return;
  try { (_urlPrevia === null ? gh.replace : gh.push)(null, u.params, u.hash); _urlPrevia = clave; } catch (e) { /* sin historial */ }
}
function engancharHistorial() {
  const gh = window.google && google.script && google.script.history;
  if (!gh) return;
  gh.setChangeHandler(function (ev) {
    const loc = (ev && ev.location) || {}, p = loc.parameter || {};
    const plano = {}; Object.keys(p).forEach(function (k) { plano[k] = Array.isArray(p[k]) ? p[k][0] : p[k]; });
    const ruta = rutaDeUrl(plano), norm = function (h) { return h.replace(/^#\/?/, ''); };
    if (norm(ruta) !== norm(location.hash)) { _desdeHistorial = true; location.hash = ruta; }
  });
}
function cerrarMenu() { $('#side').classList.remove('abierta'); $('#velo-lat').classList.remove('on'); }

/* Enlaces internos (#/…): se navega por JavaScript para que nunca recarguen el marco de Apps Script (pantalla en blanco). */
document.addEventListener('click', function (e) {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const a = e.target.closest && e.target.closest('a[href]');
  if (!a) return;
  const h = a.getAttribute('href');
  if (h && h.indexOf('#/') === 0) {
    e.preventDefault();
    if (location.hash === h) navegar(); else location.hash = h;
  } else if (h && /^https?:/i.test(h) && !a.target) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
});

/* Esqueletos de carga */
function esqNav() {
  let h = ''; for (let i = 0; i < 8; i++) h += '<div class="esq-nav"><span class="esq" style="width:30px;height:30px;border-radius:9px"></span><span class="esq" style="height:12px;flex:1;max-width:' + (100 + (i * 37) % 70) + 'px"></span></div>';
  return h;
}
function esqInicio() {
  return '<div class="esq c" style="height:190px"></div><div class="kpis" style="margin-top:20px">' + [1, 2, 3, 4].map(function () { return '<div class="esq c" style="height:84px"></div>'; }).join('') + '</div><div class="esq-rejilla">' + [1, 2, 3, 4, 5, 6].map(function () { return '<div class="esq c" style="height:150px"></div>'; }).join('') + '</div>';
}
function esqArticulo() {
  return '<div class="esq" style="height:12px;width:240px;margin-bottom:22px"></div><div class="esq" style="height:38px;width:70%;margin-bottom:16px"></div><div class="esq" style="height:14px;width:90%;margin-bottom:10px"></div><div class="esq c" style="height:70px;margin:18px 0"></div><div class="esq c" style="height:360px"></div>';
}

/** Cuenta animada de 0 al valor en los elementos con data-n (su primer nodo hijo es el texto). */
function animarNumeros(raiz) {
  $$('[data-n]', raiz).forEach(function (el) {
    const fin = +el.dataset.n; if (!fin) return;
    const t0 = performance.now(), dur = 800;
    (function paso(t) {
      const k = Math.min(1, (t - t0) / dur), v = Math.round(fin * (1 - Math.pow(1 - k, 3)));
      el.firstChild.nodeValue = String(v); if (k < 1) requestAnimationFrame(paso);
    })(t0);
  });
}

function navegar() {
  const r = rutaActual();
  cerrarMenu();
  window.scrollTo(0, 0);
  const v = $('#vista');
  const o = r.p[0] || '';
  if (o === '') vistaInicio(v);
  else if (o === 's') vistaSeccion(v, r.p[1]);
  else if (o === 'a') vistaArticulo(v, r.p[1]);
  else if (o === 'buscar') vistaBusqueda(v, r.q.get('q') || '');
  else if (o === 'nuevo') esAdmin() ? vistaEditor(v, null, r.p[1]) : vistaSinPermiso(v);
  else if (o === 'editar') esAdmin() ? vistaEditor(v, r.p[1]) : vistaSinPermiso(v);
  else if (o === 'admin') esAdmin() ? vistaAdmin(v, r.p[1] || 'secciones') : vistaSinPermiso(v);
  else vistaNoEncontrada(v);
  pintarNav();
  sincronizarUrl();
}

function vistaSinPermiso(v) { v.innerHTML = '<div class="vacio"><i class="ph ph-lock-key"></i><h2>Solo para administradores</h2><p class="suave">No tienes permiso para ver esta página.</p><p><a class="btn btn-p" href="#/">Ir al inicio</a></p></div>'; }
function vistaNoEncontrada(v) { v.innerHTML = '<div class="vacio"><i class="ph ph-compass"></i><h2>No encontramos esa página</h2><p><a class="btn btn-p" href="#/">Ir al inicio</a></p></div>'; }

/* ── Cabecera ── */
function pintarCabecera() {
  $('#ver').textContent = 'v' + (window.VERSION || '');
  const ini = (S.user.nombre || S.user.email).split(' ').map(function (p) { return p.charAt(0); }).slice(0, 2).join('').toUpperCase();
  $('#yo').innerHTML = '<div class="avatar">' + esc(ini) + '</div><div class="quien"><b>' + esc(S.user.nombre) + '</b><span>' + esc(S.user.rol) + '</span></div>';
  const ico = $('#btn-tema i'); ico.className = 'ph ph-' + (document.documentElement.dataset.tema === 'oscuro' ? 'sun' : 'moon');
}

/* ── Barra lateral ── */
function secActualId() {
  const r = rutaActual();
  if (r.p[0] === 's') { const s = secPorSlug(r.p[1]); return s ? s.id : null; }
  if (r.p[0] === 'a') { const a = artPorSlug(r.p[1]); return a ? a.seccion_id : null; }
  if (r.p[0] === 'nuevo') { const s = secPorSlug(r.p[1]); return s ? s.id : null; }
  return null;
}

function itemArt(a, c, actSlug) {
  const p = a.estado === 'Validado' ? 'v' : (a.estado === 'En revisión' ? 'r' : '');
  return '<a class="nav-art ' + (a.slug === actSlug ? 'act' : '') + '" href="' + rutaArt(a) + '" style="--c:' + c + '"><span class="pt ' + p + '" title="' + esc(a.estado) + '"></span><span>' + esc(a.titulo) + '</span></a>';
}

function pintarNav() {
  const r = rutaActual();
  const actSec = secActualId();
  const actSlug = r.p[0] === 'a' ? r.p[1] : '';
  const actRaiz = actSec ? (raizDe(secPorId(actSec)) || {}).id : null;
  if (actRaiz) S.abiertas = new Set([actRaiz]); // acordeón: solo queda abierta la sección actual
  const recienAbierta = actRaiz && actRaiz !== S.abPrev; S.abPrev = actRaiz;
  let h = '<div class="grupo-t etq">Navegación</div>';
  h += '<a class="nav-i ' + (r.p.length === 0 ? 'act' : '') + '" href="#/" style="--c:#49677a"><span class="ico"><i class="ph ph-house"></i></span>Inicio</a>';
  h += '<div class="grupo-t etq" style="margin-top:14px">Secciones</div>';
  raices().forEach(function (s) {
    const abierta = S.abiertas.has(s.id);
    const total = artsDeArbol(s).length;
    h += '<a class="nav-i ' + (abierta ? 'abierto ' : '') + (actRaiz === s.id && !actSlug ? 'act' : '') + '" href="' + rutaSec(s) + '" data-sec="' + s.id + '" style="--c:' + esc(s.color) + '"><span class="ico"><i class="ph ' + esc(s.icono) + '"></i></span><span>' + esc(s.nombre) + '</span><i class="ph ph-caret-right flecha"></i></a>';
    if (abierta) {
      h += '<div class="nav-arts' + (recienAbierta && actRaiz === s.id ? ' anim' : '') + '" style="--c:' + esc(s.color) + '">';
      artsDe(s.id).forEach(function (a) { h += itemArt(a, s.color, actSlug); });
      hijosDe(s.id).forEach(function (hs) {
        h += '<div class="nav-sub">' + esc(hs.nombre) + '</div>';
        artsDe(hs.id).forEach(function (a) { h += itemArt(a, s.color, actSlug); });
      });
      if (!total) h += '<div class="peq suave" style="padding:4px 8px">Aún sin artículos</div>';
      h += '</div>';
    }
  });
  if (esAdmin()) {
    h += '<div class="grupo-t etq" style="margin-top:18px">Administración</div>';
    h += '<a class="nav-i" href="#/nuevo" style="--c:#c19528"><span class="ico"><i class="ph ph-plus"></i></span>Nuevo artículo</a>';
    h += '<a class="nav-i ' + (r.p[0] === 'admin' ? 'act' : '') + '" href="#/admin/secciones" style="--c:#49677a"><span class="ico"><i class="ph ph-gear"></i></span>Gestión</a>';
  }
  $('#nav').innerHTML = h;
}

/* ── Arranque ── */
function pantallaError(msg) {
  $('#vista').innerHTML = '<div class="vacio"><i class="ph ph-plugs"></i><h2>No pudimos abrir OxoPedia</h2><p class="suave" style="margin:6px 0 16px">' + esc(msg) + '</p><button class="btn btn-p" onclick="location.reload()"><i class="ph ph-arrow-clockwise"></i> Reintentar</button></div>';
  $('#nav').innerHTML = ''; $('#yo').innerHTML = '';
}

async function arrancar() {
  $('#nav').innerHTML = esqNav(); $('#vista').innerHTML = esqInicio();
  try {
    const d = await api('arranque');
    S.user = d.usuario; S.cfg = d.config; S.secciones = d.secciones; S.articulos = d.articulos;
  } catch (e) { pantallaError(e.message); return; }
  document.title = S.cfg.nombre_app + ' · Conocimiento de TI';
  pintarCabecera();
  if (!location.hash) {
    const ini = {}; Object.keys(window.URL_INICIAL || {}).forEach(function (k) { try { ini[k] = decodeURIComponent(window.URL_INICIAL[k]); } catch (e) { /* valor inválido */ } });
    const ruta = rutaDeUrl(ini);
    if (ruta !== '#/') location.hash = ruta;
  }
  _hashPrevio = location.hash;
  engancharHistorial();
  navegar();
}

document.addEventListener('DOMContentLoaded', function () {
  $('#btn-menu').onclick = function () { const ab = $('#side').classList.toggle('abierta'); $('#velo-lat').classList.toggle('on', ab); };
  $('#velo-lat').onclick = cerrarMenu;
  $('#btn-tema').onclick = function () {
    const t = document.documentElement.dataset.tema === 'oscuro' ? 'claro' : 'oscuro';
    document.documentElement.dataset.tema = t;
    try { localStorage.setItem('oxopedia-tema', t); } catch (e) { /* sin almacenamiento */ }
    pintarCabecera();
  };
  prepararBuscador();
  arrancar();
});
</script>
