<style>
/* OxoPedia · Sistema de diseño — identidad OxoHotel (azul estructural, oro como señal) + acento propio por sección */
:root {
  --font: 'Montserrat', Calibri, Arial, sans-serif;
  --mono: ui-monospace, 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace;
  --blue: #49677a; --blue-h: #3b5667; --gold: #c19528; --green: #5f6d5f; --red: #aa3333;
  --ink: #1c1c1c; --txt: #464b4e; --dark: #606060; --gl: #dddddd; --gm: #c6c6c6; --cream: #cec7c3;
  --bg: #f4f3f0; --paper: #ffffff; --paper2: #faf9f7; --callout: #f0f4f7; --hover: #eef1f3;
  --acc: var(--blue);
  --ok-bg: #e6ebe6; --warn-bg: #f8efd3; --err-bg: #f6e0e0;
  --code-bg: #1f2a31; --code-tx: #e6ecef;
  --r: 8px; --top: 60px; --side: 288px;
  --sombra: 0 1px 2px rgba(28,28,28,.05), 0 6px 20px rgba(28,28,28,.06);
  color-scheme: light;
}
:root[data-tema='oscuro'] {
  --blue: #8db1c7; --blue-h: #a8c4d4; --gold: #d6ac45; --green: #9db19d; --red: #e48a8a;
  --ink: #eef1f3; --txt: #c3cbd0; --dark: #a3adb3; --gl: #323c43; --gm: #46525a; --cream: #8b979d;
  --bg: #14181b; --paper: #1c2226; --paper2: #20282d; --callout: #222c33; --hover: #263038;
  --ok-bg: #243228; --warn-bg: #3a3218; --err-bg: #3f2424; --code-bg: #11171a; --code-tx: #dfe7eb;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Tonos derivados del acento de cada sección (se calculan en cada elemento, no en :root) */
body, .tarjeta-sec, .tarjeta-art, .cab-sec, .card, .bl, .cuerpo-art, .paso, .modal, [style*="--acc"] {
  --acc-bg: color-mix(in srgb, var(--acc) 9%, var(--paper));
  --acc-bd: color-mix(in srgb, var(--acc) 30%, var(--paper));
}
[hidden] { display: none !important; }
html { font-size: 15px; scroll-padding-top: calc(var(--top) + 16px); }
body { margin: 0; font-family: var(--font); color: var(--txt); background: var(--bg); line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 2rem; font-weight: 700; color: var(--ink); letter-spacing: -.01em; line-height: 1.2; }
h2 { font-size: 1.3rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
h3 { font-size: 1.02rem; font-weight: 700; color: var(--ink); }
a { color: var(--blue); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.etq { font-size: .68rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.suave { color: var(--dark); } .peq { font-size: .85rem; } .neg { font-weight: 700; }
.mono { font-family: var(--mono); }

/* ── Cabecera ── */
.top { position: sticky; top: 0; z-index: 40; height: var(--top); background: var(--paper); border-top: 4px solid var(--blue); border-bottom: 1px solid var(--gl); display: flex; align-items: center; gap: 14px; padding: 0 20px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--blue); font-weight: 700; letter-spacing: .22em; text-transform: uppercase; font-size: .8rem; white-space: nowrap; }
.marca img { height: 28px; display: block; }
.marca .sub { color: var(--gold); }
.buscador { position: relative; flex: 1; max-width: 560px; margin: 0 auto; }
.buscador input { width: 100%; font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--gl); border-radius: var(--r); padding: 9px 56px 9px 40px; }
.buscador input:focus { outline: 2px solid var(--blue); outline-offset: -1px; background: var(--paper); }
.buscador .ph-magnifying-glass { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--dark); font-size: 1.1rem; pointer-events: none; }
.buscador kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 .7rem var(--font); color: var(--dark); border: 1px solid var(--gl); border-radius: 4px; padding: 1px 6px; background: var(--paper); }
.sugerencias { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--paper); border: 1px solid var(--gl); border-radius: var(--r); box-shadow: var(--sombra); overflow: hidden; z-index: 50; }
.sugerencias a { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--gl); }
.sugerencias a:last-child { border-bottom: 0; }
.sugerencias a:hover, .sugerencias a.sel { background: var(--hover); }
.sugerencias small { color: var(--dark); font-size: .76rem; }
.btn-ico { width: 38px; height: 38px; border: 0; border-radius: var(--r); background: transparent; color: var(--dark); display: inline-grid; place-items: center; cursor: pointer; font-size: 1.25rem; }
.btn-ico:hover { background: var(--hover); color: var(--ink); }
.yo { display: flex; align-items: center; gap: 9px; padding: 4px 6px 4px 4px; border-radius: 999px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: var(--paper); display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
.yo .quien { line-height: 1.2; font-size: .78rem; } .yo .quien b { display: block; color: var(--ink); } .yo .quien span { color: var(--dark); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
#btn-menu { display: none; }

/* ── Estructura ── */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; background: var(--paper); border-right: 1px solid var(--gl); padding: 18px 12px 28px; }
.side .grupo-t { padding: 4px 10px 8px; }
.nav-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: var(--r); cursor: pointer; text-align: left; text-decoration: none; color: var(--txt); font-size: .86rem; font-weight: 600; line-height: 1.3; }
.nav-i:hover { background: var(--hover); color: var(--ink); }
.nav-i .ico { width: 28px; height: 28px; flex: none; border-radius: 7px; display: grid; place-items: center; font-size: 1.05rem; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--paper)); }
.nav-i .cuenta { margin-left: auto; font-size: .7rem; font-weight: 700; color: var(--dark); }
.nav-i.act { background: color-mix(in srgb, var(--c, var(--blue)) 11%, var(--paper)); color: var(--ink); }
.nav-i .flecha { margin-left: auto; font-size: .8rem; color: var(--dark); transition: transform .15s; }
.nav-i.abierto .flecha { transform: rotate(90deg); }
.nav-arts { margin: 2px 0 8px 24px; padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--c) 35%, var(--paper)); display: flex; flex-direction: column; gap: 1px; }
.nav-art { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--txt); font-size: .8rem; line-height: 1.35; font-weight: 500; }
.nav-art:hover { background: var(--hover); color: var(--ink); }
.nav-art.act { color: var(--ink); font-weight: 700; background: color-mix(in srgb, var(--c) 11%, var(--paper)); }
.nav-art .pt { width: 7px; height: 7px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--gold); }
.nav-art .pt.v { background: var(--green); } .nav-art .pt.r { background: var(--blue); }
.nav-sub { margin: 6px 0 2px 4px; font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dark); }
.main { min-width: 0; padding: 28px clamp(18px, 3.5vw, 48px) 80px; }
.pagina { max-width: 1160px; margin: 0 auto; }
.migas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .78rem; color: var(--dark); margin-bottom: 16px; }
.migas a { color: var(--dark); text-decoration: none; font-weight: 600; } .migas a:hover { color: var(--blue); text-decoration: underline; }
.migas .ph { font-size: .7rem; }

/* ── Componentes ── */
.card { background: var(--paper); border: 1px solid var(--gl); border-top: 3px solid var(--acc); border-radius: var(--r); padding: 18px 20px; }
.card.plana { border-top-width: 1px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: var(--r); padding: 9px 16px; font-weight: 600; font-size: .86rem; cursor: pointer; line-height: 1.2; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn-p { background: var(--blue); color: var(--paper); } .btn-p:hover { background: var(--blue-h); }
.btn-s { background: var(--paper); color: var(--ink); border-color: var(--gl); } .btn-s:hover { border-color: var(--blue); background: var(--hover); }
.btn-t { background: transparent; color: var(--blue); padding: 7px 10px; } .btn-t:hover { background: var(--hover); }
.btn-x { background: var(--red); color: #fff; } .btn-x:hover { filter: brightness(.92); }
.btn-chico { padding: 6px 11px; font-size: .8rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.girar { animation: girar .8s linear infinite; display: inline-block; } @keyframes girar { to { transform: rotate(360deg); } }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; color: var(--dark); background: var(--paper2); border: 1px solid var(--gl); border-radius: 999px; padding: 2px 10px; text-decoration: none; }
a.chip:hover { border-color: var(--blue); color: var(--blue); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.Borrador { background: var(--warn-bg); color: #8a6a0b; } .badge.Validado { background: var(--ok-bg); color: #3f5a42; } .badge.En-revision { background: var(--callout); color: var(--blue); }
:root[data-tema='oscuro'] .badge.Borrador { color: #e6c96b; } :root[data-tema='oscuro'] .badge.Validado { color: #b5d2b8; }
.vacio { text-align: center; padding: 48px 20px; color: var(--dark); } .vacio .ph { font-size: 2.2rem; color: var(--gm); display: block; margin-bottom: 8px; }
.esq { background: linear-gradient(90deg, var(--gl) 25%, var(--hover) 50%, var(--gl) 75%); background-size: 200% 100%; animation: esq 1.2s infinite; border-radius: 6px; }
@keyframes esq { to { background-position: -200% 0; } }

/* Formularios */
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo > label, .lbl { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dark); }
input, select, textarea { font: inherit; font-size: .9rem; color: var(--ink); background: var(--paper); border: 1px solid var(--gl); border-radius: var(--r); padding: 9px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; border-color: var(--blue); }
textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
input[type=color] { padding: 2px; height: 38px; cursor: pointer; }
input[type=checkbox] { width: auto; }
.fila { display: grid; gap: 14px; } .fila.dos { grid-template-columns: 1fr 1fr; } .fila.tres { grid-template-columns: 1fr 1fr 1fr; }

/* Modal y avisos */
.velo { position: fixed; inset: 0; background: rgba(20,26,30,.55); z-index: 80; display: grid; place-items: center; padding: 18px; }
.modal { background: var(--paper); border-radius: 12px; width: min(560px, 100%); max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); border-top: 4px solid var(--blue); }
.modal.ancho { width: min(900px, 100%); }
.modal > header { padding: 16px 20px 6px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal > .cuerpo { padding: 8px 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal > footer { padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--gl); }
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--paper); padding: 11px 16px; border-radius: var(--r); box-shadow: var(--sombra); font-size: .86rem; font-weight: 600; display: flex; gap: 10px; align-items: center; max-width: 380px; animation: entra .2s ease-out; }
.toast.err { background: var(--red); color: #fff; } .toast.ok { background: var(--green); color: #fff; }
@keyframes entra { from { transform: translateY(8px); opacity: 0; } }
.lightbox { position: fixed; inset: 0; z-index: 85; background: rgba(10,14,16,.9); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

/* ── Inicio ── */
.hero { background: var(--paper); border: 1px solid var(--gl); border-left: 6px solid var(--blue); border-radius: var(--r); padding: 30px 34px; margin-bottom: 22px; display: grid; gap: 14px; }
.hero h1 span { color: var(--blue); }
.hero p { color: var(--dark); max-width: 640px; font-size: 1.02rem; }
.hero .buscador-grande { position: relative; max-width: 560px; }
.hero .buscador-grande input { padding: 13px 16px 13px 46px; font-size: 1rem; background: var(--bg); }
.hero .buscador-grande .ph { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; color: var(--dark); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
.kpi { background: var(--paper); border: 1px solid var(--gl); border-top: 3px solid var(--blue); border-radius: var(--r); padding: 14px 18px; }
.kpi .n { font-size: 2.1rem; font-weight: 700; color: var(--blue); line-height: 1.1; } .kpi .n sup { font-size: .9rem; color: var(--gold); margin-left: 2px; }
.kpi .l { font-size: .66rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--dark); margin-top: 4px; }
.kpi.oro { border-top-color: var(--gold); } .kpi.verde { border-top-color: var(--green); } .kpi.verde .n { color: var(--green); }
.sec-t { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
.grid-sec { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tarjeta-sec { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--txt); background: var(--paper); border: 1px solid var(--gl); border-top: 3px solid var(--acc); border-radius: var(--r); padding: 18px; transition: transform .15s, box-shadow .15s; }
.tarjeta-sec:hover { transform: translateY(-2px); box-shadow: var(--sombra); }
.tarjeta-sec .ico { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 1.4rem; color: var(--acc); background: var(--acc-bg); }
.tarjeta-sec h3 { font-size: 1rem; } .tarjeta-sec p { font-size: .84rem; color: var(--dark); line-height: 1.5; flex: 1; }
.tarjeta-sec .pie { display: flex; justify-content: space-between; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
.dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
.lista-art { display: flex; flex-direction: column; }
.item-art { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--gl); text-decoration: none; color: var(--ink); }
.item-art:last-child { border-bottom: 0; } .item-art:hover { background: var(--hover); }
.item-art .t { flex: 1; min-width: 0; } .item-art .t b { display: block; font-size: .88rem; font-weight: 600; line-height: 1.35; } .item-art .t small { color: var(--dark); font-size: .74rem; }
.punto-sec { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* ── Sección ── */
.cab-sec { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; }
.cab-sec .ico { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 1.9rem; color: var(--acc); background: var(--acc-bg); border: 1px solid var(--acc-bd); flex: none; }
.cab-sec p { color: var(--dark); max-width: 680px; margin-top: 4px; }
.grid-art { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tarjeta-art { display: flex; flex-direction: column; gap: 8px; text-decoration: none; background: var(--paper); border: 1px solid var(--gl); border-top: 3px solid var(--acc); border-radius: var(--r); padding: 16px 18px; color: var(--txt); }
.tarjeta-art:hover { box-shadow: var(--sombra); } .tarjeta-art h3 { font-size: .98rem; line-height: 1.35; } .tarjeta-art p { font-size: .84rem; color: var(--dark); flex: 1; }
.tarjeta-art .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .74rem; color: var(--dark); }

/* ── Artículo ── */
.art-layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; align-items: start; }
.art-cab { margin-bottom: 8px; }
.art-cab .etq { color: var(--acc); }
.art-cab h1 { margin: 6px 0 12px; }
.art-resumen { font-size: 1.05rem; color: var(--dark); margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--gl); }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; padding: 14px 18px; background: var(--paper); border: 1px solid var(--gl); border-left: 4px solid var(--acc); border-radius: var(--r); margin-bottom: 14px; }
.meta-grid div > span:first-child { display: block; font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dark); }
.meta-grid div b { font-size: .86rem; color: var(--ink); font-weight: 600; word-break: break-word; }
.por-revisar { color: var(--red); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; align-items: center; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.cuerpo-art { background: var(--paper); border: 1px solid var(--gl); border-radius: var(--r); padding: clamp(18px, 3vw, 36px); display: flex; flex-direction: column; gap: 18px; }
.cuerpo-art > h2 { margin-top: 14px; padding-top: 18px; border-top: 1px solid var(--gl); display: flex; gap: 10px; align-items: baseline; }
.cuerpo-art > h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.cuerpo-art > h2::before { content: ''; width: 4px; align-self: stretch; background: var(--acc); border-radius: 2px; flex: none; }
.cuerpo-art > h3 { margin-top: 6px; color: var(--acc); font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.txt p { margin: 0 0 .7em; } .txt p:last-child { margin: 0; } .txt ul, .txt ol { margin: 0 0 .7em; padding-left: 1.3em; } .txt li { margin: .2em 0; }
.txt code, .paso code, .alerta code, .desp code { font-family: var(--mono); font-size: .86em; background: var(--callout); border: 1px solid var(--gl); border-radius: 4px; padding: 1px 6px; color: var(--ink); }
.txt strong { color: var(--ink); }
mark.completar { background: var(--warn-bg); color: #7a5b05; border-bottom: 2px dashed var(--gold); padding: 0 3px; border-radius: 3px; font-weight: 600; }
:root[data-tema='oscuro'] mark.completar { color: #f0d78e; }
.paso { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; }
.paso > .num { width: 34px; height: 34px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .9rem; margin-top: 1px; position: relative; }
.paso > .cont { display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; min-width: 0; }
.paso + .paso > .num::before { content: ''; position: absolute; left: 50%; bottom: 100%; width: 2px; height: 20px; background: var(--acc-bd); transform: translateX(-50%); display: none; }
.fig { margin: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.fig .marco { border: 1px solid var(--gl); border-radius: var(--r); overflow: hidden; background: var(--paper2); max-width: 100%; position: relative; min-height: 80px; box-shadow: var(--sombra); }
.fig img { display: block; max-width: 100%; height: auto; cursor: zoom-in; }
.fig .cargando { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dark); font-size: 1.4rem; }
.fig figcaption { font-size: .78rem; color: var(--dark); font-style: italic; }
.codigo { border-radius: var(--r); overflow: hidden; background: var(--code-bg); border: 1px solid color-mix(in srgb, var(--code-bg) 70%, #000); }
