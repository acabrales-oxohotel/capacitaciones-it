/* ── Actualizar datos (catálogo + vista actual) ── */
async function recargarTodo(btn) {
  if (window.__sucio && !window.confirm('Tienes cambios sin guardar en el editor. Si actualizas se perderán. ¿Continuar?')) return;
  const ico = btn && btn.querySelector('i'); if (ico) ico.classList.add('girar');
  try { await refrescarCatalogo(); window.__sucio = false; navegar(); toast('Datos actualizados', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
  finally { if (ico) ico.classList.remove('girar'); }
}

function abrirManual(tabId) {
  const lista = MANUAL.filter(function (x) { return !x.admin || esAdmin(); });
  const m = modal({ titulo: 'Manual de usuario', ancho: true, cuerpo:
    '<div class="manual"><nav class="manual-nav">' + lista.map(function (x) { return '<button type="button" data-mt="' + x.id + '"><i class="ph ph-' + x.i + '"></i>' + esc(x.t) + '</button>'; }).join('') + '</nav><div class="manual-c txt"></div></div>' });
  const mostrar = function (id) {
    const x = lista.find(function (y) { return y.id === id; }) || lista[0];
    $$('[data-mt]', m.el).forEach(function (b) { b.classList.toggle('act', b.dataset.mt === x.id); });
    const c = $('.manual-c', m.el); c.innerHTML = '<h3>' + esc(x.t) + '</h3>' + x.h; c.scrollTop = 0;
  };
  $$('[data-mt]', m.el).forEach(function (b) { b.onclick = function () { mostrar(b.dataset.mt); }; });
  mostrar(tabId);
}

document.addEventListener('click', function (e) {
  const man = e.target.closest && e.target.closest('[data-manual]');
  if (man) { abrirManual(); return; }
  const rec = e.target.closest && e.target.closest('[data-recargar]');
  if (rec) recargarTodo(rec);
});

/**
 * Selector de íconos con buscador. Inserta el HTML con selectorIconosHtml(valor) y luego llama a selectorIconos(contenedor, inputId).
 */
function selectorIconosHtml(valor) {
  return '<div class="campo"><label>Ícono</label><div class="ic-sel"><span class="ic-vista"><i class="ph ' + esc(valor) + '" id="ic-actual"></i></span><input id="sc-icono" value="' + esc(valor) + '" placeholder="ph-folder" aria-label="Nombre del ícono"></div>' +
    '<div class="ic-buscar"><i class="ph ph-magnifying-glass"></i><input id="ic-q" type="search" placeholder="Buscar ícono: red, correo, servidor…" autocomplete="off"></div>' +
    '<div class="ic-rejilla" id="ic-rejilla"></div><p class="peq suave" id="ic-info" style="margin:6px 0 0"></p></div>';
}

function selectorIconos(raiz) {
  const campo = $('#sc-icono', raiz), q = $('#ic-q', raiz), rej = $('#ic-rejilla', raiz), info = $('#ic-info', raiz), act = $('#ic-actual', raiz);
  const pintar = function () {
    const t = _normChars(q.value).split(/\s+/).filter(Boolean);
    const l = CATALOGO_ICONOS.filter(function (x) { return t.every(function (w) { return x.k.indexOf(w) >= 0; }); });
    const sel = campo.value.trim();
    rej.innerHTML = l.map(function (x) { return '<button type="button" class="ic-b' + (sel === 'ph-' + x.n ? ' act' : '') + '" data-ico="ph-' + x.n + '" title="' + x.n + '"><i class="ph ph-' + x.n + '"></i></button>'; }).join('') || '<span class="peq suave" style="grid-column:1/-1;padding:8px">Sin resultados. Prueba otra palabra.</span>';
    info.textContent = l.length + ' de ' + CATALOGO_ICONOS.length + ' íconos. También puedes escribir un nombre de phosphoricons.com con el prefijo «ph-».';
  };
  q.addEventListener('input', pintar);
  campo.addEventListener('input', function () { act.className = 'ph ' + campo.value.trim(); });
  rej.addEventListener('click', function (e) {
    const b = e.target.closest('[data-ico]'); if (!b) return;
    campo.value = b.dataset.ico; act.className = 'ph ' + b.dataset.ico;
    $$('.ic-b', rej).forEach(function (x) { x.classList.toggle('act', x === b); });
  });
  pintar();
}
